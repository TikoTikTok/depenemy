<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <!-- Gradient on the underline: upstream red → supply-chain orange -->
    <linearGradient id="uline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <!-- Subtle glow behind badge -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="100" rx="14" fill="#0d1117"/>

  <!-- "dep" in white -->
  <text x="26" y="68"
    font-family="'Courier New', Courier, monospace"
    font-size="52"
    font-weight="700"
    fill="#ecf0f1"
    letter-spacing="-1">dep</text>

  <!-- "enemy" in red (same as upstream) -->
  <text x="126" y="68"
    font-family="'Courier New', Courier, monospace"
    font-size="52"
    font-weight="700"
    fill="#e74c3c"
    letter-spacing="-1">enemy</text>

  <!-- Gradient underline (red → orange) instead of solid red -->
  <rect x="126" y="74" width="169" height="3" rx="1.5" fill="url(#uline)"/>

  <!-- Small dot separator -->
  <circle cx="118" cy="66" r="3.5" fill="#555"/>

  <!-- ── Patch / shield badge (top-right) ─────────────── -->
  <!-- Shield body -->
  <path d="M291 8 L307 12 L307 24 Q307 32 299 36 Q291 32 291 24 Z"
        fill="#27ae60" filter="url(#glow)"/>
  <!-- Shield highlight -->
  <path d="M293 10 L305 14 L305 24 Q305 31 299 34.5 Q293 31 293 24 Z"
        fill="#2ecc71" opacity="0.5"/>
  <!-- Checkmark inside shield -->
  <polyline points="294,22 298,26 305,16"
            fill="none" stroke="white" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "+" superscript next to "enemy" end — signals extended ruleset -->
  <text x="299" y="42"
    font-family="'Courier New', Courier, monospace"
    font-size="9"
    font-weight="700"
    fill="#2ecc71"
    text-anchor="middle"
    letter-spacing="0">SC</text>
</svg>
